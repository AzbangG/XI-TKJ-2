<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XI TKJ 2</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

    <div class="bg-slideshow" id="bgSlideshow"></div>

    <nav class="top-nav" id="topNavRoot"></nav>

    <div class="header">
        <div class="title-wrapper">
            <h1 class="main-title">
                <span class="title-line">Kelas</span>
                <span class="title-line title-highlight">XI TKJ 2</span>
            </h1>
            <div class="title-decoration"></div>
        </div>
        <p class="subtitle" id="socialLinks">Anak XI TKJ 2 Bangun Nusantara</p>
    </div>

    <nav class="bottom-nav" id="bottomNav"></nav>

    <div class="page-wrap">
        <div id="siswaGrid" class="siswa-grid">
            <p>Memuat data siswa...</p>
        </div>
    </div>

    <!-- Modal pengaturan tampilan halaman siswa (admin) -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Pengaturan Halaman</h3>
            <div class="field">
                <label>Background Halaman</label>
                <img id="cfgBackgroundPreview" class="hidden" style="width:100%;border-radius:10px;margin-bottom:10px;max-height:160px;object-fit:cover;">
                <input type="file" id="cfgBackgroundFile" accept="image/*">
                <button type="button" id="cfgRemoveBackground" class="btn-danger" style="margin-top:8px;">Hapus Background</button>
            </div>
            <div class="field">
                <label for="cfgInstagram">Link Instagram Kelas</label>
                <input type="text" id="cfgInstagram" placeholder="https://instagram.com/...">
            </div>
            <div class="field">
                <label for="cfgTiktok">Link TikTok Kelas</label>
                <input type="text" id="cfgTiktok" placeholder="https://tiktok.com/@...">
            </div>
            <div class="edit-actions">
                <button id="cfgSave" class="btn btn-save">Simpan</button>
                <button id="cfgCancel" class="btn btn-cancel">Batal</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/index.js"></script>
</body>
</html>
