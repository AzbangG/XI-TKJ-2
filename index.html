<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XI TKJ 2</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

    <div class="bg-slideshow" id="bgSlideshow"></div>

    <nav class="top-nav">
        <div class="nav-left">
            <div class="date-time-display" id="dateTimeDisplay">
                <div class="current-date" id="currentDate">Loading...</div>
                <div class="current-time" id="currentTime">Loading...</div>
            </div>
        </div>
        <div class="nav-right">
            <div class="user-info" id="userInfo" style="display:none;">
                <span class="user-icon">👤</span>
                <span class="username" id="username">User</span>
            </div>
            <a href="login.html" id="loginLink" style="display:none;">👤 Login</a>
            <button id="settingsBtn" class="nav-btn hidden">⚙️</button>
            <button id="theme-toggle" class="theme-toggle">
                <div class="toggle-track">
                    <div class="toggle-thumb">
                        <span class="icon sun">☀️</span>
                        <span class="icon moon">🌙</span>
                    </div>
                </div>
            </button>
            <button id="logout-btn" class="logout-btn" style="display:none;">
                <span>🚪</span>
            </button>
        </div>
    </nav>

    <div class="header">
        <div class="title-wrapper">
            <h1 class="main-title">
                <span class="title-line">Kelas</span>
                <span class="title-line title-highlight">XI TKJ 2</span>
            </h1>
            <div class="title-decoration"></div>
        </div>
        <p class="subtitle" id="socialLinks">Anak XI TKJ 2 Bangun Nusantara</p>
    </div>

    <nav class="bottom-nav" id="bottomNav"></nav>

    <div class="page-wrap">
        <div id="siswaGrid" class="siswa-grid">
            <p>Memuat data siswa...</p>
        </div>
    </div>

    <!-- Modal pengaturan tampilan halaman siswa (admin) -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Pengaturan Halaman</h3>
            <div class="field">
                <label for="cfgBackground">URL Background Halaman</label>
                <input type="text" id="cfgBackground" placeholder="https://...">
            </div>
            <div class="field">
                <label for="cfgInstagram">Link Instagram Kelas</label>
                <input type="text" id="cfgInstagram" placeholder="https://instagram.com/...">
            </div>
            <div class="field">
                <label for="cfgTiktok">Link TikTok Kelas</label>
                <input type="text" id="cfgTiktok" placeholder="https://tiktok.com/@...">
            </div>
            <div class="edit-actions">
                <button id="cfgSave" class="btn btn-save">Simpan</button>
                <button id="cfgCancel" class="btn btn-cancel">Batal</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/index.js"></script>
</body>
</html>
