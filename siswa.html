<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Detail Siswa - XI TKJ 2</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

    <div class="bg-slideshow" id="bgSlideshow"></div>

    <nav class="top-nav">
        <div class="nav-left">
            <div class="date-time-display" id="dateTimeDisplay">
                <div class="current-date" id="currentDate">Loading...</div>
                <div class="current-time" id="currentTime">Loading...</div>

        </div>

            </div>
            <a href="login.html" id="loginLink" style="display:none;">👤 Login</a>
            <button id="theme-toggle" class="theme-toggle">
                <div class="toggle-track">
                    <div class="toggle-thumb">
                        <span class="icon sun">☀️</span>
                        <span class="icon moon">🌙</span>
                    </div>
                </div>
            </button>
            <button id="logout-btn" class="logout-btn" style="display:none;">
                <span>🚪</span>
            </button>
        </div>
    </nav>

    <div class="header">
        <div class="title-wrapper">
            <h1 class="main-title" id="detailTitle">
                <span class="title-line">Detail</span>
                <span class="title-line title-highlight">Siswa</span>
            </h1>
            <div class="title-decoration"></div>
        </div>
    </div>

    <nav class="bottom-nav" id="bottomNav"></nav>

    <div class="page-wrap">
        <div id="detailCard" class="detail-card">
            <p>Memuat data...</p>

    <audio id="bgMusic" loop></audio>

    <script type="module" src="js/siswa.js"></script>
