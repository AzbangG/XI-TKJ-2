<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - X TKJ 3</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="bg-slideshow" id="bgSlideshow"></div>

    <button id="theme-toggle" class="theme-toggle floating-theme-toggle">
        <div class="toggle-track">
            <div class="toggle-thumb">
                <span class="icon sun">☀️</span>
                <span class="icon moon">🌙</span>
            </div>
        </div>
    </button>

    <div class="login-page">
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo">🔐</div>
                <h1 class="login-title">Selamat Datang</h1>
                <p class="login-subtitle">Login untuk mengakses Website Kelas X TKJ 3</p>
            </div>

            <div class="error-message" id="errorMessage">Username atau password salah!</div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="Masukkan username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Masukkan password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword">👁️</button>
                    </div>
                </div>

                <button type="submit" class="login-btn">Masuk</button>
            </form>

            <div class="guest-link">
                Atau <a href="#" id="guestLogin">masuk sebagai tamu</a>
            </div>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
