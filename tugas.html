<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas - XI TKJ 2</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

    <div class="bg-slideshow" id="bgSlideshow"></div>

    <nav class="top-nav">
        <div class="nav-left">
            <div class="date-time-display" id="dateTimeDisplay">
                <div class="current-date" id="currentDate">Loading...</div>
                <div class="current-time" id="currentTime">Loading...</div>
            </div>
        </div>
        <div class="nav-right">
            <div class="user-info" id="userInfo" style="display:none;">
                <span class="user-icon">👤</span>
                <span class="username" id="username">User</span>
            </div>
            <a href="login.html" id="loginLink" style="display:none;">👤 Login</a>
            <button id="theme-toggle" class="theme-toggle">
                <div class="toggle-track">
                    <div class="toggle-thumb">
                        <span class="icon sun">☀️</span>
                        <span class="icon moon">🌙</span>
                    </div>
                </div>
            </button>
            <button id="logout-btn" class="logout-btn" style="display:none;">
                <span>🚪</span>
            </button>
        </div>
    </nav>

    <div class="header">
        <div class="title-wrapper">
            <h1 class="main-title">
                <span class="title-line">Daftar</span>
                <span class="title-line title-highlight">Tugas</span>
            </h1>
            <div class="title-decoration"></div>
        </div>
        <p class="subtitle">Kelas XI TKJ 2</p>
    </div>

    <nav class="bottom-nav" id="bottomNav"></nav>

    <div class="page-wrap">
        <form id="addTugasForm" class="form-card hidden" style="margin-bottom:24px;">
            <h2>Tambah Tugas</h2>
            <div class="field"><label>Judul</label><input type="text" id="tJudul" required></div>
            <div class="field"><label>Mapel</label><input type="text" id="tMapel"></div>
            <div class="field"><label>Deskripsi</label><input type="text" id="tDeskripsi"></div>
            <div class="field"><label>Deadline</label><input type="date" id="tDeadline"></div>
            <button type="submit" class="form-submit">Tambah Tugas</button>
        </form>

        <div id="tugasList" class="tugas-list">
            <p>Memuat tugas...</p>
        </div>
    </div>

    <script type="module" src="js/tugas.js"></script>
</body>
</html>
