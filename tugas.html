<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas - XI TKJ 2</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

    <div class="bg-slideshow" id="bgSlideshow"></div>

    <nav class="top-nav" id="topNavRoot"></nav>

    <div class="header">
        <div class="title-wrapper">
            <h1 class="main-title">
                <span class="title-line">Daftar</span>
                <span class="title-line title-highlight">Tugas</span>
            </h1>
            <div class="title-decoration"></div>
        </div>
        <p class="subtitle">Kelas XI TKJ 2</p>
    </div>

    <nav class="bottom-nav" id="bottomNav"></nav>

    <div class="page-wrap">
        <form id="addTugasForm" class="form-card hidden" style="margin-bottom:24px;">
            <h2>Tambah Tugas</h2>
            <div class="field"><label>Judul</label><input type="text" id="tJudul" required></div>
            <div class="field">
                <label>Mapel</label>
                <select id="tMapel">
                    <option value="">-- Pilih Mapel --</option>
                    <optgroup label="Umum">
                        <option>Matematika</option>
                        <option>Bahasa Indonesia</option>
                        <option>Bahasa Inggris</option>
                        <option>Pendidikan Agama Islam</option>
                        <option>PKN</option>
                        <option>Sejarah Indonesia</option>
                        <option>Seni Budaya</option>
                        <option>PJOK</option>
                        <option>Bahasa Sunda</option>
                    </optgroup>
                    <optgroup label="Kejuruan TKJ">
                        <option>Komputer dan Jaringan Dasar</option>
                        <option>Pemrograman Dasar</option>
                        <option>Dasar Desain Grafis</option>
                        <option>Sistem Komputer</option>
                        <option>Administrasi Infrastruktur Jaringan</option>
                        <option>Administrasi Sistem Jaringan</option>
                        <option>Teknologi Jaringan Berbasis Luas (WAN)</option>
                        <option>Teknologi Layanan Jaringan</option>
                        <option>Produk Kreatif dan Kewirausahaan</option>
                    </optgroup>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>
            <div class="field"><label>Deskripsi</label><input type="text" id="tDeskripsi"></div>
            <div class="field"><label>Deadline</label><input type="date" id="tDeadline"></div>
            <button type="submit" class="form-submit">Tambah Tugas</button>
        </form>

        <div id="tugasList" class="tugas-list">
            <p>Memuat tugas...</p>
        </div>
    </div>

    <script type="module" src="js/tugas.js"></script>
</body>
</html>
