<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - XI TKJ 2</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

    <div class="bg-slideshow" id="bgSlideshow"></div>

    <nav class="top-nav" id="topNavRoot"></nav>

    <div class="header">
        <div class="title-wrapper">
            <h1 class="main-title">
                <span class="title-line">Chat</span>
                <span class="title-line title-highlight">Kelas</span>
            </h1>
            <div class="title-decoration"></div>
        </div>
        <p class="subtitle">XI TKJ 2</p>
    </div>

    <nav class="bottom-nav" id="bottomNav"></nav>

    <div class="page-wrap">
        <div class="chat-wrap">
            <div class="chat-messages" id="chatMessages">
                <p style="text-align:center;opacity:0.6;">Memuat chat...</p>
            </div>

            <form id="chatForm" class="chat-input-bar hidden">
                <textarea id="chatInput" placeholder="Tulis pesan..." rows="1" maxlength="1000" required></textarea>
                <button type="submit" class="chat-send-btn"><img src="Images/Icon/Send.png" alt="Kirim" width="19" height="19"></button>
            </form>

            <div id="chatGuestNotice" class="chat-guest-notice hidden">
                Login buat ikut ngobrol di chat kelas.
            </div>
        </div>
    </div>

    <script type="module" src="js/chat.js"></script>
</body>
</html>
